name: CORS probe
on:
  push:
    branches: [ci-logs-nse-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          O='https://viktorpapa469.github.io'
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          P=https://priceapi.moneycontrol.com/technicalCompanyData/globalMarket
          for u in \
            "https://api.gold-api.com/symbols" \
            "https://api.gold-api.com/price/XAU" \
            "https://api.gold-api.com/price/XAG" \
            "https://api.frankfurter.app/latest?from=USD&to=INR" \
            "https://priceapi.moneycontrol.com/pricefeed/notapplicable/commodityspot/%24%24%3BGOLD" \
            "https://priceapi.moneycontrol.com/technicalCompanyData/commodity/getCommodityListingData?view=overview&deviceType=W&exchange=MCX" \
            "https://appfeeds.moneycontrol.com/jsonapi/market/global_indices&format=json" \
            "https://appfeeds.moneycontrol.com/jsonapi/commodity/index&format=json" \
            "https://priceapi.moneycontrol.com/pricefeed/mcx/commodityfuture/CRUDEOIL" \
            "https://priceapi.moneycontrol.com/pricefeed/mcx/commodityfuture/GOLD" \
            ; do
            echo "=== $u"
            curl -sS -m 20 -A "$UA" -H "Origin: $O" -D /tmp/h -o /tmp/b "$u" || true
            head -1 /tmp/h; grep -i '^access-control-allow-origin' /tmp/h || echo "(no ACAO)"
            python3 -c "
          import json,sys
          t=open('/tmp/b').read()
          try: j=json.loads(t)
          except Exception: print(t[:400]); sys.exit()
          if 'dataList' in j:
            h=[x['name'] for x in j['header']]
            for g in j['dataList']:
              print('##', g.get('heading') or g.get('name') or '')
              for r in g.get('data',[]): print('  ', dict(zip(h,r)) if isinstance(r,list) else r)
          else: print(json.dumps(j)[:900])
          "
          done
