name: NSE probe (one-off diagnostic)
# Tries NSE's live data addresses from GitHub's servers and saves the status of each to the ci-logs-nse-probe branch.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - name: Probe
        run: |
          cat > probe.py <<'PY'
          import json, time, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          s = requests.Session(); s.headers.update({"User-Agent": UA, "Accept": "application/json, text/plain, */*", "Accept-Language": "en-US,en;q=0.9", "Referer": "https://www.nseindia.com/"})
          out = []
          for p in ("/", "/market-data/live-equity-market"):
              r = s.get("https://www.nseindia.com" + p, timeout=15); out.append({"warm": p, "status": r.status_code, "cookies": sorted(s.cookies.keys())})
          tests = ["/api/allIndices", "/api/equity-stockIndices?index=SECURITIES%20IN%20F%26O", "/api/equity-stockIndices?index=NIFTY%2050",
                   "/api/equity-stockIndices?index=NIFTY%20500", "/api/liveEquity-derivatives?index=stock_fut",
                   "/api/live-analysis-variations?index=gainers", "/api/market-data-pre-open?key=FO", "/api/quote-equity?symbol=INFY",
                   "/api/NextApi/apiClient?functionName=getIndexData&type=All", "/api/marketStatus"]
          for t in tests:
              for referer in ("https://www.nseindia.com/market-data/live-equity-market", "https://www.nseindia.com/"):
                  try:
                      r = s.get("https://www.nseindia.com" + t, timeout=15, headers={"Referer": referer})
                      body = r.text[:300]
                      try:
                          js = r.json(); keys = list(js.keys())[:8] if isinstance(js, dict) else type(js).__name__
                          n = len(js.get("data", [])) if isinstance(js, dict) and isinstance(js.get("data"), list) else None
                      except Exception:
                          keys, n = None, None
                      out.append({"url": t, "referer": referer[-25:], "status": r.status_code, "keys": keys, "rows": n, "body": None if keys else body})
                  except Exception as e:
                      out.append({"url": t, "error": str(e)[:200]})
                  time.sleep(1)
          json.dump(out, open("probe.json", "w"), indent=1)
          print(json.dumps(out, indent=1))
          PY
          python probe.py
      - name: Save result
        run: |
          mkdir out && mv probe.json out/ && cd out && git init -q -b ci-logs-nse-probe && git add -A &&
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm probe &&
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs-nse-probe
