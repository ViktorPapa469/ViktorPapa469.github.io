# Event Run Sheet (/events/) phone alerts. Runs every 5 minutes; see .github/scripts/send_event_push.py.
# Sends a reminder about 5 minutes before each sub-event, and every notification organisers send.
# GitHub can start scheduled runs a few minutes late; the sender catches up from the last run's time.
name: Event run sheet alerts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: events-push
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            events/config.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt
      - run: pip install -r .github/scripts/requirements.txt
      - name: Read the last run's time
        run: |
          (git fetch -q --depth=1 origin ci-state-events && git show origin/ci-state-events:last.txt > /tmp/last.txt) 2>/dev/null || echo 0 > /tmp/last.txt
          echo "LAST=$(tr -dc 0-9 < /tmp/last.txt)" >> "$GITHUB_ENV"
      - name: Send alerts
        run: python .github/scripts/send_event_push.py
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
      - name: Save this run's time to the ci-state-events branch
        if: success()
        run: |
          [ -f /tmp/events_last.txt ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan state && git rm -rq --cached . && rm -rf ./* .github events 2>/dev/null || true
          cp /tmp/events_last.txt last.txt && git add last.txt && git commit -qm "event alerts: last run" && git push -qf origin state:ci-state-events
