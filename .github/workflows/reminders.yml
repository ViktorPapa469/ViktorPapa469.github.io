# Sends Fovea's morning and evening reminders. Runs every 15 minutes; see .github/scripts/send_reminders.py.
name: Fovea reminders
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt
      - run: pip install -r .github/scripts/requirements.txt
      - run: python .github/scripts/send_reminders.py
        env:
          FB_PROJECT: fovea-25d37
          FB_KEY: AIzaSyAjuDlySp9coYIyI4KVFd0o7t2sqV3n5Ew   # the app's public web key (also in index.html)
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
