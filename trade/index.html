<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opening Bell</title>
<meta name="description" content="Stock screener, position sizing and paper trading for NSE F&O stocks. For market study only.">
<meta name="theme-color" content="#0E141B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Opening Bell">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Always dark: a slate night sky with a faint green glow (the open) and a faint gold one (the bell), glass tiles on top. */
:root{
  --bg:#0E141B; --ink:#E8EDF1; --ink2:#9AA6B1; --ink3:#6F7C88;
  --glass:rgba(255,255,255,.055); --glass-hi:rgba(255,255,255,.09); --line:rgba(255,255,255,.10); --line-hi:rgba(255,255,255,.18);
  --blur:blur(18px) saturate(1.25);
  --up:#4ACB91; --up-soft:rgba(74,203,145,.15); --down:#FF7D60; --down-soft:rgba(255,125,96,.15);
  --gold:#F2B33D; --gold-soft:rgba(242,179,61,.15); --focus:#9DB4FF;
  --cond:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* iPhone home-screen app: with the see-through status bar, iOS 26 (WebKit bug 301108) sizes the page short and leaves a
   band under the tab bar that the page can't draw in. The status bar is now solid black, which avoids it once the app is
   added to the home screen again; until then the band takes the tab bar's colour so it reads as part of the bar. */
html{background:#0F151D;height:100%}
body{margin:0;height:100%;color:var(--ink);font:400 15px/1.45 var(--sans);font-variant-numeric:tabular-nums;
  -webkit-text-size-adjust:100%;overflow:hidden;background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(110% 55% at 0% 0%, rgba(40,128,100,.26), transparent 62%),
    radial-gradient(90% 45% at 100% 100%, rgba(242,179,61,.11), transparent 60%),
    radial-gradient(70% 40% at 100% 20%, rgba(70,96,160,.12), transparent 65%),
    linear-gradient(180deg,#131C26 0%,#0C1117 100%)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--ink2)}.small{font-size:13px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}

/* frame: header, clock, toolbar, pages, page dots; tab bar fixed at the bottom */
.app{height:100%;display:flex;flex-direction:column;max-width:620px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 0 calc(var(--tabh) + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 8px}
.brand{font:700 19px/1 var(--cond);letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.fresh{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);min-width:0}
.fresh select,.pill-btn{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink)}
.fresh select{max-width:120px}
.brand,.pill-btn,.fresh > span{white-space:nowrap}
@media (max-width:430px){ .upd-l{display:none} .fresh select{max-width:96px} }
/* in the browser the Get app button joins the header: drop the update time so Refresh stays on screen */
@media (max-width:430px){ .fresh:has(#getApp:not([hidden])) #fresh > span{display:none} .fresh:has(#getApp:not([hidden])) select{max-width:84px} }
.top{min-width:0}.fresh{flex-shrink:1;overflow:hidden}
.gold-pill{background:var(--gold);color:#1B1405;border-color:var(--gold);font-weight:600}

.clock{margin:0 16px 8px;padding:10px 12px 6px}
.phase{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:0 0 7px}
.phase b{font:600 16px/1.2 var(--cond)}
.phase span{font-size:12.5px;color:var(--ink2)}
.strip{position:relative;display:flex;height:22px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.04)}
.seg{border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.seg:last-child{border-right:0}
.seg.pre{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.07) 5px 6px)}
.seg.win{background:var(--gold-soft);color:var(--ink)}
.seg.past{opacity:.5}
.now{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;background:var(--gold);border-radius:2px;box-shadow:0 0 10px var(--gold)}
.ticks{position:relative;height:16px;font-size:10.5px;color:var(--ink3)}
.ticks span{position:absolute;transform:translateX(-50%);top:2px}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}

#banners{padding:0 16px}
.banner{margin:0 0 8px;padding:7px 11px;border-radius:12px;background:var(--gold-soft);border:1px solid rgba(242,179,61,.25);font-size:12.5px}
.banner.err{background:var(--down-soft);border-color:rgba(255,125,96,.3)}
#toolbar{padding:0 16px}
#toolbar:empty{display:none}

/* pages: one screen each, swipe sideways for the next */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;padding:2px 16px 10px;min-height:0}
.pagenav{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 16px 4px}
.pagenav .arrow{width:34px;height:30px;border-radius:10px;border:1px solid var(--line);background:var(--glass);cursor:pointer;color:var(--ink);
  display:flex;align-items:center;justify-content:center}
.pagenav .arrow[disabled]{opacity:.3;cursor:default}
.dots{display:flex;gap:6px;align-items:center}
.dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--ink3);cursor:pointer}
.dots button[aria-current=true]{width:20px;border-radius:4px;background:var(--gold)}
.pageno{font-size:11.5px;color:var(--ink2);min-width:36px;text-align:center}

h2{font:600 15px/1.3 var(--sans);margin:4px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;color:var(--ink)}
h2 .count{font-weight:400;font-size:12.5px;color:var(--ink2)}
.lede{margin:0 0 10px;color:var(--ink2);font-size:13px}
.tile{padding:12px 14px;margin:0 0 10px}

.pill{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--glass-hi)}
.pill.up{background:var(--up-soft);color:var(--up)}.pill.down{background:var(--down-soft);color:var(--down)}.pill.gold{background:var(--gold-soft);color:var(--gold)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.fact b{display:block;font-weight:600;font-size:16.5px}
.fact > span{font-size:11.5px;color:var(--ink2)}
.cues{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--ink2)}
.cues b{font-weight:600}

.sector{display:grid;grid-template-columns:minmax(0,1fr) 32% 54px;gap:10px;align-items:center;padding:5px 0;font-size:13.5px}
.sector .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:7px}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line-hi)}
.track i{position:absolute;top:0;height:100%;border-radius:3px}
.sector .v{text-align:right}

.seg-ctl{display:flex;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:3px;margin:0 0 8px}
.seg-ctl button{flex:1;border:0;background:none;padding:6px 4px;border-radius:999px;cursor:pointer;font-size:13.5px;color:var(--ink2)}
.seg-ctl button[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600}

/* stock tiles */
.stock{padding:11px 13px;margin:0 0 9px}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
button.head{cursor:pointer}
.sym{font:700 19px/1.1 var(--cond);letter-spacing:.01em}
.ind{display:block;font-size:11.5px;color:var(--ink2);margin-top:1px}
.px{text-align:right;white-space:nowrap;font-weight:500}
.px small{display:block;font-size:12.5px;font-weight:500}
.why{margin:5px 0 0;font-size:12.5px;color:var(--ink2)}
.plan{margin-top:6px;font-size:13.5px}
.plan b{font-weight:600}
.warn{margin-top:7px;padding:6px 10px;border-radius:10px;background:var(--gold-soft);font-size:12.5px}
.status{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px;vertical-align:3px;background:var(--glass-hi);font-family:var(--sans)}
.status.go{background:var(--up-soft);color:var(--up)}.status.fail{background:var(--down-soft);color:var(--down)}.status.weak{background:var(--gold-soft);color:var(--gold)}
.side{font:600 11.5px/1 var(--sans);padding:3px 7px;border-radius:5px;margin-left:6px;vertical-align:3px}
.side.long{background:var(--up-soft);color:var(--up)}.side.short{background:var(--down-soft);color:var(--down)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin-top:9px;background:var(--line);border-radius:11px;overflow:hidden}
.levels div{background:rgba(14,20,27,.55);padding:6px 9px}
.levels span{display:block;font-size:10.5px;color:var(--ink2)}
.levels b{font-weight:600;font-size:14px}
.hot{border-color:rgba(242,179,61,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 1px rgba(242,179,61,.35)}
.row-actions{display:flex;gap:8px;margin-top:9px}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.gold{background:var(--gold);color:#1B1405}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkish{background:none;border:0;padding:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:inherit}

.events .ev{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.events .ev:last-child{border-bottom:0}
.rules{margin:0;padding-left:20px}.rules li{margin:6px 0}
.empty{padding:18px 2px;color:var(--ink2)}
.empty p{margin:0 0 12px}
.note{font-size:12.5px;color:var(--ink2);margin:10px 0}
.note a{color:inherit}

/* settings fields */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{flex:1}
.field small{display:block;color:var(--ink2);font-size:11.5px}
.field.sub{padding-left:12px}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=search],input[type=date],input[type=time],select.input,textarea{
  padding:8px 10px;border:1px solid var(--line-hi);border-radius:10px;background:rgba(0,0,0,.25);color:var(--ink);min-width:0}
.field input[type=number]{width:118px;text-align:right}
.switch{width:44px;height:26px;border-radius:999px;border:0;background:rgba(255,255,255,.16);position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-checked=true]{background:var(--up)}
.switch[aria-checked=true]::after{left:21px}
.switch[disabled]{opacity:.5}
.stack{display:flex;flex-direction:column;gap:8px}
.stack input{width:100%}
.inline{display:flex;gap:8px;flex-wrap:wrap}

/* Test tab */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip i{font-style:normal;font-size:11px;margin-left:7px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.1)}
.chip[aria-pressed=true]{background:var(--gold-soft);border-color:rgba(242,179,61,.45);color:var(--ink);font-weight:600}
.wl-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.wl-row:last-child{border-bottom:0}
.wl-row .sym{font-size:17px}
.wl-head{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.wl-head b{font:600 18px/1.2 var(--cond)}
.wl-head .btn{margin-left:auto}
.wl-stock{padding:8px 0;border-bottom:1px solid var(--line);position:relative}
.wl-stock .wl-top{padding-right:30px}
.x.wl-del{position:absolute;top:6px;right:-4px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--ink2);cursor:pointer;font-size:13px;line-height:1}
.x.wl-del:hover{color:var(--down);border-color:var(--down)}
#wl-add{margin-top:12px}.sugg .add{color:var(--gold);font-weight:600}.sugg button[disabled]{opacity:.55;cursor:default}
.wl-stock:last-child{border-bottom:0}
.wl-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.wl-top .sym{font-size:17px}
.wl-sum{font-size:12.5px;margin-top:3px}
.ohlc{display:flex;flex-wrap:wrap;gap:2px 11px;margin:7px 0 0;font-size:12px;color:var(--ink2)}
.ohlc b{color:var(--ink);font-weight:500}
.ohlc .d{margin-left:auto;color:var(--ink3)}
.chk{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:2px 8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.chk:last-child{border-bottom:0}
.chk.na{opacity:.6}
.trk{width:100%;border-collapse:collapse;font-size:12.5px}.trk th{font-weight:500;color:var(--ink2);text-align:right;padding:3px 4px}
.trk td{text-align:right;padding:4px;border-top:1px solid var(--line)}.trk th:first-child,.trk td:first-child{text-align:left}
@media (max-width:430px){ .fresh:has(select) #getApp{display:none} }   /* Get app is also in Settings */
.stock .head .px{flex-shrink:0}
.gl{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.gl:last-child{border-bottom:0}.gl b{font-weight:600}.gl span{color:var(--ink2);line-height:1.45}
.gl-letter{margin:12px 0 0;font:600 12px var(--sans);color:var(--gold);letter-spacing:.06em}.gl-letter:first-child{margin-top:0}
.why.outcome{color:var(--ink);margin-top:6px}
.seg-scroll{overflow-x:auto;scrollbar-width:none}.seg-scroll::-webkit-scrollbar{display:none}
.seg-scroll button{flex:0 0 auto;padding:6px 12px;white-space:nowrap}
.allst td,.allst th{font-size:12px;padding:5px 3px}.allst tbody tr{cursor:pointer}.allst td.pass{color:var(--up);font-weight:600}
.allst td.avg{font-weight:600}.allst td:first-child{font-weight:600;max-width:96px;overflow:hidden;text-overflow:ellipsis}
.assess p{margin:0 0 10px;line-height:1.55;font-size:14.5px}.assess p:last-child{margin:0}
.risk{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.risk-h{margin:8px 0 4px;font-weight:600;font-size:13.5px}.risk-h:first-child{margin-top:0}
.risk-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;padding:4px 0;font-size:13px;line-height:1.45}
.rtag{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;background:var(--glass-hi);color:var(--ink2);min-width:40px;text-align:center}
.rtag.is-now{background:var(--down-soft);color:var(--down)}
.risk.has-now.qual .risk-row.is-hot{border-left:2px solid var(--down);padding-left:8px;margin-left:-10px}
.risk-sep{margin:14px 0 0;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.risk-group{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:0 0 2px}.risk-group span{font-size:12px;color:var(--ink2)}
.an-strip > button{position:relative}
.an-strip > button.alert{border-color:var(--down);box-shadow:inset 0 0 0 1px var(--down)}
.an-strip > button.alert[aria-selected=true]{box-shadow:inset 0 0 0 1px var(--down),0 0 0 2px var(--gold)}
.an-strip .badge{position:absolute;top:-7px;right:8px;font:600 10px/1 var(--sans);font-style:normal;padding:3px 6px;border-radius:999px;background:var(--down);color:#fff}
.livetag{font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.02em}
.sugg{margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--glass-hi)}
.sugg button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;padding:9px 12px;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;text-align:left;font:inherit;font-size:13.5px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button:focus{background:var(--glass)}
.sugg .sym{font-weight:600}.sugg .sym b,.sugg .nm b{color:var(--gold)}
.sugg .nm{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sugg .nm b{font-weight:600}
.sugg .ex{font-size:11px;color:var(--ink2);white-space:nowrap}
.an-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin:10px 0 0}
.an-strip > button{padding:8px 10px;border-radius:12px;display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;color:inherit;font:inherit}
.an-strip > button[aria-selected=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.an-nav{padding:4px 0 8px}
.an-pager{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;transition:height .2s ease;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.an-pager::-webkit-scrollbar{display:none}
.an-pager > .tile{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;margin:0}
.an-strip b{font-size:18px}.an-strip span{font-size:11.5px;color:var(--ink2);line-height:1.25}
.chk i{font-style:normal;font-weight:700;text-align:center}
.chk .v{text-align:right;white-space:nowrap}
.chk small{grid-column:2 / -1;color:var(--ink2);font-size:11.5px;margin-top:-2px}
.x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--ink2);cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
.result{margin-top:8px;padding:8px 10px;border-radius:11px;background:rgba(0,0,0,.22);font-size:13px}
.result b{font-weight:600}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;border-radius:18px 18px 0 0;border-bottom:0;
  display:flex;justify-content:center;padding:4px 4px calc(4px + env(safe-area-inset-bottom));background:rgba(16,23,31,.72)}
nav.tabs .in{display:flex;width:100%;max-width:620px}
nav.tabs button{flex:1;border:0;background:none;padding:7px 0 5px;cursor:pointer;color:var(--ink3);font-size:11px;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;min-width:0}
nav.tabs svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected=true]{color:var(--ink);font-weight:600}
nav.tabs button[aria-selected=true]::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--gold)}
nav.tabs .dot{position:absolute;top:5px;left:calc(50% + 7px);width:7px;height:7px;border-radius:50%;background:var(--gold)}

/* sheet (forms) and toast */
#sheet{position:fixed;inset:0;z-index:15;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,12,.55)}
#sheet .in{width:100%;max-width:620px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;border-bottom:0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(22,30,40,.92)}
#sheet h3{font:600 18px/1.2 var(--cond);margin:0 0 4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2)}
.form label.full{grid-column:1 / -1}
.form input,.form select,.form textarea{width:100%;font-size:15px}
.form-err{color:var(--down);font-size:13px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;
  background:rgba(232,237,241,.95);color:#0E141B;padding:9px 14px;border-radius:12px;font-size:13.5px;max-width:90vw}

/* terms gate: nothing else is shown or loaded until the terms are accepted */
body.locked .app, body.locked nav.tabs{display:none}
#gate{position:fixed;inset:0;z-index:20;display:flex;justify-content:center}
.gate-in{width:100%;max-width:620px;display:flex;flex-direction:column;height:100%;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom))}
.gate-in h1{font:600 21px/1.2 var(--cond);margin:0 0 6px}
.terms-box{flex:1;min-height:120px;overflow:auto;padding:4px 14px 14px;font-size:13.5px}
.terms-box .key{background:rgba(0,0,0,.22)!important;border-color:var(--line)!important}
.checks{margin:10px 0 2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:13px;cursor:pointer}
.check input{width:19px;height:19px;margin:1px 0 0;flex:none;accent-color:var(--gold)}
.gate-actions{display:flex;gap:10px;margin-top:8px}
.gate-actions .btn{flex:1;padding:12px 16px}
.steps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink3);margin:0 0 12px}
.steps b{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;background:var(--glass-hi);color:var(--ink2);font-size:11px}
.steps b.on{background:var(--gold);color:#1B1405}
.steps span{color:var(--ink3)}
.gate-foot{font-size:11.5px;color:var(--ink2);margin:8px 0 0}
.gate-foot a{color:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
"use strict";
/* ================================================================== settings (on this phone; synced to the profile when signed in) */
var KINDS = [["screen", "Screen ready", "About 9:12, with the market mood and top setups."],
             ["breakouts", "Breakouts", "Each setup that triggers between 9:30 and 11:00, with a suggested position."],
             ["squareoff", "Square-off reminder", "3:15, on days the market is open."],
             ["preview", "Evening preview", "About 7 PM, the next session's list."]];
var DEF = {capital:500000, risk:0.5, maxpos:100, lossR:3, source:"live", push:false, pushAt:0, pushEp:"", pushTerms:"",
           kinds:{screen:true, breakouts:true, squareoff:true, preview:false}, updatedAt:0};
var S = (function(){ try { var x = JSON.parse(localStorage.getItem("ob-settings") || "{}");
  var o = Object.assign({}, DEF, x); o.kinds = Object.assign({}, DEF.kinds, x.kinds || {}); return o; } catch(e){ return Object.assign({}, DEF); } })();
function saveS(){
  try { localStorage.setItem("ob-settings", JSON.stringify(S)); } catch(e){}
  // the notification helper can't read this page's storage, so it gets its own copy of what it needs for positions
  if (window.caches) caches.open("ob-prefs").then(function(c){
    return c.put("https://data.local/settings.json", new Response(JSON.stringify({capital:S.capital, risk:S.risk, maxpos:S.maxpos}),
                 {headers:{"Content-Type":"application/json"}}));
  }).catch(function(){});
}
function changedS(){ S.updatedAt = Date.now(); saveS(); syncSoon(); }

var st = {tab:"plan", side:"longs", swing:"pullbacks", list:null, page:{}, pre:null, orb:null, days:[], day:null, latest:null,
          loading:false, error:null, noData:false, loadedAt:0, base:"", pushBusy:false, pushNote:"", authBusy:false, authNote:""};

/* ================================================================== helpers */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function ok(x){ return typeof x === "number" && isFinite(x); }
function rs(x, d){ if (!ok(x)) return "–"; d = d == null ? 2 : d; return "₹" + x.toLocaleString("en-IN", {minimumFractionDigits:d, maximumFractionDigits:d}); }
function n(x, d){ return ok(x) ? x.toLocaleString("en-IN", {minimumFractionDigits:d||0, maximumFractionDigits:d||0}) : "–"; }
function pc(x, d){ if (!ok(x)) return "–"; d = d == null ? 2 : d; return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(d) + "%"; }
function rr(x){ return ok(x) ? (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2) + "R" : "–"; }
function tone(x){ return !ok(x) || x === 0 ? "" : x > 0 ? "up" : "down"; }
function $(s){ return document.querySelector(s); }
function indOf(x){ return x && x !== "Other" ? x : ""; }
function chunk(a, k){ var o = []; for (var i = 0; i < a.length; i += k) o.push(a.slice(i, i + k)); return o; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function ist(){
  var f = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Kolkata", year:"numeric", month:"2-digit", day:"2-digit",
                                            hour:"2-digit", minute:"2-digit", weekday:"short", hourCycle:"h23"});
  var p = {}; f.formatToParts(new Date()).forEach(function(x){ p[x.type] = x.value; });
  return {date:p.year + "-" + p.month + "-" + p.day, mins:+p.hour * 60 + +p.minute, wd:p.weekday,
          hm:p.hour + ":" + p.minute, weekend:p.weekday === "Sat" || p.weekday === "Sun"};
}
function niceDate(iso){
  if (!iso) return "";
  var d = new Date(iso.slice(0, 10) + "T12:00:00+05:30");
  return d.toLocaleDateString("en-IN", {weekday:"short", day:"numeric", month:"short", timeZone:"Asia/Kolkata"});
}
function hmOf(iso){ return iso ? iso.slice(11, 16) : ""; }
/* a time, with the day when it isn't today ("Thu 19:44") */
function stamp(iso){ if (!iso) return ""; var d = iso.slice(0, 10); return d === ist().date ? hmOf(iso) : new Date(d + "T12:00:00").toLocaleDateString("en-GB", {weekday:"short"}) + " " + hmOf(iso); }
function toast(msg, ms){
  document.querySelectorAll(".toast").forEach(function(x){ x.remove(); });
  var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(function(){ t.remove(); }, ms || Math.max(3200, msg.length * 55));
}

/* position sizing lives on the phone (and in your own profile), never in the published data */
function riskAmt(mult){ return S.capital * S.risk / 100 * (ok(mult) ? mult : 1); }
function qty(entry, perShare, mult){
  if (!ok(entry) || !ok(perShare) || perShare <= 0) return 0;
  var q = Math.floor(riskAmt(mult) / perShare), cap = Math.floor(S.capital * S.maxpos / 100 / entry);
  return Math.max(0, Math.min(q, cap));
}
function lots(q, lot){ return ok(lot) && lot > 0 && q >= lot ? " (" + (q / lot).toFixed(1) + " lots)" : ""; }

/* ================================================================== session clock */
var SEGS = [
  {from:540, to:555, w:12, cls:"pre", label:"Pre-open"},
  {from:555, to:570, w:13, cls:"", label:"Range"},
  {from:570, to:660, w:33, cls:"win", label:"Breakout window"},
  {from:660, to:915, w:30, cls:"", label:"Midday"},
  {from:915, to:930, w:12, cls:"", label:"Close"}
];
var TICKS = [[540,"9:00"],[570,"9:30"],[660,"11:00"],[915,"3:15"],[930,"3:30"]];
function posOf(m){
  var x = 0;
  for (var i = 0; i < SEGS.length; i++){ var s = SEGS[i];
    if (m <= s.to){ return x + s.w * Math.max(0, (m - s.from) / (s.to - s.from)); } x += s.w; }
  return 100;
}
function phaseText(t){
  var m = t.mins;
  if (t.weekend) return ["Market closed", "Weekend. Next screen Monday about 9:12."];
  if (m < 540) return ["Before the open", "Screen refreshes about 9:12."];
  if (m < 555) return ["Pre-open auction", "Opening prices being set."];
  if (m < 570) return ["Range forming", "Let the first 15 minutes pass."];
  if (m < 660) return ["Breakout window", "Watch Live for triggered setups."];
  if (m < 915) return ["Midday", "No new breakouts from this list."];
  if (m < 930) return ["Square off", "Intraday positions close soon."];
  return ["Market closed", "Preview about 7 PM, screen about 9:12."];
}
function drawClock(){
  var t = ist(), p = phaseText(t);
  $("#phase").textContent = p[0];
  $("#todo").textContent = p[1];
  var html = SEGS.map(function(s){
    var past = !t.weekend && t.mins >= s.to;
    return '<div class="seg ' + s.cls + (past ? " past" : "") + '" style="width:' + s.w + '%">' + (s.w > 12 ? esc(s.label) : "") + "</div>";
  }).join("");
  if (!t.weekend && t.mins >= 540 && t.mins <= 930) html += '<i class="now" style="left:' + posOf(t.mins).toFixed(2) + '%" title="Now ' + t.hm + ' IST"></i>';
  $("#strip").innerHTML = html;
  $("#strip").setAttribute("aria-label", "Trading session, now " + t.hm + " IST");
  $("#ticks").innerHTML = TICKS.map(function(k){ return '<span style="left:' + posOf(k[0]) + '%">' + k[1] + "</span>"; }).join("");
}

/* ================================================================== screener data */
var params = new URLSearchParams(location.search);
function demoBase(){ return new URL("demo/", location.href).href; }
function getJSON(url){
  // the plain branch link is cached by GitHub for minutes; a changing query asks it for a fresh copy
  if (/\/trade-data\//.test(url)) url += (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Math.floor(Date.now() / 15e3);
  return fetch(url, {cache:"no-store"}).then(function(r){
    if (!r.ok){ var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r.json();
  });
}
var GH = (function(){ try { return JSON.parse(localStorage.getItem("ob-gh")) || {}; } catch(e){ return {}; } })();
function saveGH(){ try { localStorage.setItem("ob-gh", JSON.stringify({sha:GH.sha, etag:GH.etag})); } catch(e){} }
function resolveBase(){
  if (S.source === "demo") return Promise.resolve(demoBase());
  if (params.get("data")) return Promise.resolve(new URL(params.get("data"), location.href).href);
  var host = location.hostname;
  if (!/\.github\.io$/.test(host)) return Promise.resolve(demoBase());
  var owner = host.split(".")[0];
  var raw = "https://raw.githubusercontent.com/" + owner + "/" + host + "/";
  // Ask GitHub which commit holds the latest data, then read that exact commit (the plain branch link can lag ~5 min).
  // GitHub allows 60 such questions an hour per network, but "has it changed since <etag>?" answered "no" (304) is
  // free, so the last answer is kept and sent along. If GitHub still says no, fall back to the branch link.
  var h = {Accept:"application/vnd.github.sha"};
  if (GH.etag && GH.sha) h["If-None-Match"] = GH.etag;
  return fetch("https://api.github.com/repos/" + owner + "/" + host + "/commits/trade-data", {headers:h, cache:"no-store"})
    .then(function(r){
      if (r.status === 404 || r.status === 422){ var e = new Error("nodata"); e.nodata = true; throw e; }
      GH.limited = r.status === 403 || r.status === 429;
      if (r.status === 304) return GH.sha;
      if (!r.ok) return "";
      var tag = r.headers.get("ETag");
      return r.text().then(function(t){ t = (t || "").trim(); if (/^[0-9a-f]{40}$/.test(t)){ GH.sha = t; GH.etag = tag; saveGH(); } return t; });
    })
    .then(function(sha){ sha = (sha || "").trim(); return raw + (/^[0-9a-f]{40}$/.test(sha) ? sha : "trade-data") + "/"; })
    .catch(function(e){ if (e.nodata) throw e; GH.limited = true; return raw + "trade-data/"; });
}
function load(day){
  if (document.body.classList.contains("locked")) return Promise.resolve();
  st.loading = true; st.error = null; render();
  return resolveBase().then(function(base){
    if (base.replace(/[0-9a-f]{40}\/$/, "") !== (st.base || "").replace(/[0-9a-f]{40}\/$/, "")) PX.reset();
    st.base = base;
    return getJSON(base + "index.json").catch(function(){ return null; }).then(function(idx){
      st.days = idx && idx.days ? idx.days : [];
      st.latest = st.days[0] || null;
      var hist = day && day !== st.latest;
      var preU = hist ? base + "history/" + day + "_premarket.json" : base + "premarket.json";
      var orbU = hist ? base + "history/" + day + "_orb.json" : base + "orb.json";
      return Promise.all([getJSON(preU), getJSON(orbU).catch(function(){ return null; }), hist ? null : getJSON(base + "live.json").catch(function(){ return null; }), getJSON(base + "track.json").catch(function(){ return null; })]);
    });
  }).then(function(r){
    st.pre = r[0]; st.orb = r[1] && r[1].date === r[0].date ? r[1] : null;
    st.live = r[2] && r[2].date === ist().date ? r[2] : null;
    st.track = r[3] || st.track || null;   // how the screener's setups worked out (track.py)   // today's NSE prices, refreshed every minute in market hours
    st.day = st.pre.date; st.noData = false; st.loadedAt = Date.now();
    checkAlerts();
  }).catch(function(e){
    if (e.nodata || e.status === 404){ st.noData = true; st.pre = null; st.orb = null; }
    else st.error = "Couldn't reach the data (" + (e.message || "network error") + "). Showing what was loaded before.";
  }).then(function(){
    st.loading = false; render();
    loadTestPrices();
  });
}

/* new breakouts while the app is on screen: a short message (the system notification comes from the push) */
function seenKey(){ return "ob-seen-" + (st.orb ? st.orb.date : ""); }
function checkAlerts(){
  var o = st.orb; if (!o || !o.rows) return;
  var seen; try { seen = JSON.parse(localStorage.getItem(seenKey()) || "[]"); } catch(e){ seen = []; }
  var fresh = o.rows.filter(function(r){ return r.status === "TRIGGERED" && seen.indexOf(r.symbol) < 0; });
  $("#liveDot").hidden = !o.rows.some(function(r){ return r.status === "TRIGGERED"; });
  if (!fresh.length) return;
  fresh.forEach(function(r){ seen.push(r.symbol); });
  try { localStorage.setItem(seenKey(), JSON.stringify(seen)); } catch(e){}
  if (o.date !== ist().date || o.demo || document.hidden) return;
  toast(fresh.map(function(r){ return r.symbol; }).join(", ") + " triggered. See Live.");
}

/* ================================================================== Firebase: sign-in, Firestore */
/* Opening Bell's own Firebase project (separate from Fovea's: its own sign-ins, profiles and records) */
var FB = {apiKey:"AIzaSyA7xZWmVuaRYNpyCHi5jVMnSIwDK-6mCL0", projectId:"opening-bell-4fdc9"};
var VAPID_PUB = "BHQOqFb3wH3PKsfhYO-8V2FXzjjvAHIY5FHzRFTBCbX7zrBl1qUF0aDUQAVCmktDlgcNI9EClocjpr4-8jFVCSM";
var ID_URL = "https://identitytoolkit.googleapis.com/v1", TOK_URL = "https://securetoken.googleapis.com/v1", FS_URL = "https://firestore.googleapis.com/v1";
var FS_DOCS = FS_URL + "/projects/" + FB.projectId + "/databases/(default)/documents/";
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent || "") || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function standalone(){ return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true; }
function jsonOrThrow(r){ return r.text().then(function(t){ if (!r.ok) throw new Error(r.status + " " + t.slice(0, 200)); return t ? JSON.parse(t) : {}; }); }
function cred(){
  var c; try { c = JSON.parse(localStorage.getItem("ob-fb") || "null"); } catch(e){ c = null; }
  if (c && c.project !== FB.projectId){   // from the time Opening Bell shared Fovea's sign-in: start fresh in its own project
    if (c.email) st.authNote = "Opening Bell now has its own sign-in, separate from Fovea. Please create your profile again: your settings, watchlists and paper trades on this phone are kept and will be saved to it.";
    try { localStorage.removeItem("ob-fb"); } catch(e){}
    return null;
  }
  return c;
}
function setCred(c, tok, exp){
  c.project = FB.projectId;
  try { localStorage.setItem("ob-fb", JSON.stringify(c)); } catch(e){}
  fbTok = tok || null; fbExp = tok ? Date.now() + (exp || 3600) * 1000 : 0;
}
var fbTok = null, fbExp = 0;
/* the signed-in profile's token (refreshed when needed); there is no anonymous use any more */
function fbAuth(){
  var c = cred();
  if (fbTok && c && Date.now() < fbExp - 60e3) return Promise.resolve({uid:c.uid, tok:fbTok, email:c.email || ""});
  if (!c || !c.refresh) return Promise.reject(new Error("USER_NOT_FOUND: not signed in"));
  var p = c && c.refresh
    ? fetch(TOK_URL + "/token?key=" + FB.apiKey, {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"},
            body:"grant_type=refresh_token&refresh_token=" + encodeURIComponent(c.refresh)})
        .then(jsonOrThrow).then(function(r){ return {uid:r.user_id, tok:r.id_token, refresh:r.refresh_token, exp:+r.expires_in, email:c.email || ""}; })
    : fetch(ID_URL + "/accounts:signUp?key=" + FB.apiKey, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({returnSecureToken:true})})
        .then(jsonOrThrow).then(function(r){ return {uid:r.localId, tok:r.idToken, refresh:r.refreshToken, exp:+r.expiresIn, email:""}; });
  return p.then(function(a){ setCred({uid:a.uid, refresh:a.refresh, email:a.email, verified:c.verified}, a.tok, a.exp); return a; });
}
function fv(v){
  if (v === null || v === undefined) return {nullValue:null};
  if (v instanceof Date) return {timestampValue:v.toISOString()};
  if (typeof v === "boolean") return {booleanValue:v};
  if (typeof v === "number") return Number.isInteger(v) ? {integerValue:String(v)} : {doubleValue:v};
  if (typeof v === "object"){ var f = {}; Object.keys(v).forEach(function(k){ f[k] = fv(v[k]); }); return {mapValue:{fields:f}}; }
  return {stringValue:String(v)};
}
function unfv(v){
  var t = Object.keys(v)[0], x = v[t];
  if (t === "mapValue"){ var o = {}; Object.keys(x.fields || {}).forEach(function(k){ o[k] = unfv(x.fields[k]); }); return o; }
  if (t === "integerValue") return +x;
  if (t === "nullValue") return null;
  return x;
}
function fsReq(method, path, body){
  return fbAuth().then(function(a){
    return fetch(FS_DOCS + path.replace("{uid}", a.uid), {method:method, headers:{"Content-Type":"application/json", Authorization:"Bearer " + a.tok},
                                                          body:body ? JSON.stringify(body) : undefined}).then(jsonOrThrow);
  });
}

/* ================================================================== push notifications
   The phone subscribes on this app's own helper (sw.js, scope /trade/) and saves the push address in Firestore
   trade_alerts/{id}; tools/trade/push.py on GitHub sends to it. */
function pushCan(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window && (location.protocol === "https:" || location.hostname === "localhost"); }
function b64u(s){ s = s.replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function myReg(){ return navigator.serviceWorker.register("sw.js", {scope:"./"}).then(function(){ return navigator.serviceWorker.ready; }); }
function pushSub(){
  return myReg().then(function(reg){
    var fresh = function(){ return reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID_PUB)}); };
    return reg.pushManager.getSubscription().then(function(s){ return s || fresh(); });
  });
}
function pushSave(sub){
  var j = sub.toJSON();
  return fsReq("PATCH", "trade_alerts/{uid}", {fields:{endpoint:fv(j.endpoint), p256dh:fv(j.keys.p256dh), auth:fv(j.keys.auth), on:fv(true),
                                   kinds:fv(S.kinds), terms:fv(TERMS.version), device:fv(isIOS() ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Computer"),
                                   updatedAt:fv(new Date())}})
    .then(function(){ S.pushEp = j.endpoint; S.pushAt = Date.now(); S.pushTerms = TERMS.version; S.pushProject = FB.projectId; saveS(); });
}
function pushWhy(e){
  var m = String((e && e.message) || e || "");
  if (/PERMISSION_DENIED|^403/.test(m)) return "Firebase refused the request. The updated rules (tools/firebase/firestore.rules) need publishing in the Firebase console.";
  if (/OPERATION_NOT_ALLOWED/.test(m) && /[Pp]assword sign-in is disabled/.test(m)) return "Email/Password sign-in is switched off in Firebase. Turn it on in the Firebase console: Authentication, Sign-in method, Email/Password.";
  if (/OPERATION_NOT_ALLOWED/.test(m)) return "Firebase didn't allow this (" + (m.match(/"message":\s*"([^"]+)"/) || [0, "OPERATION_NOT_ALLOWED"])[1] + ").";
  if (/ADMIN_ONLY/.test(m)) return "Anonymous sign-in is switched off in Firebase. Turn it on in the Firebase console: Authentication, Sign-in method, Anonymous.";
  if (/NotAllowedError|denied/i.test(m)) return "Notifications are blocked for this site. Allow them in your browser's site settings, then try again.";
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return "No internet connection. Try again when you're online.";
  return "Something went wrong (" + m.slice(0, 80) + ").";
}
function pushOn(){
  if (isIOS() && !standalone()){ st.pushNote = "On iPhone, add Opening Bell to your Home Screen first (Share, then Add to Home Screen), open it from there, and turn this on."; render(); return; }
  if (!pushCan()){ st.pushNote = "This browser can't receive notifications. Use Chrome on Android, the Android app, or the Home Screen app on iPhone."; render(); return; }
  st.pushBusy = true; st.pushNote = "Asking for permission…"; render();
  Notification.requestPermission().then(function(p){
    if (p !== "granted") throw new Error("denied");
    return pushSub().then(pushSave);
  }).then(function(){ S.push = true; saveS(); st.pushNote = ""; toast("Notifications are on"); },
          function(e){ S.push = false; saveS(); st.pushNote = pushWhy(e); })
    .then(function(){ st.pushBusy = false; render(); });
}
function pushOff(){
  S.push = false; S.pushEp = ""; saveS(); st.pushNote = ""; render();
  var del = fsReq("DELETE", "trade_alerts/{uid}").catch(function(){});
  if ("serviceWorker" in navigator) myReg().then(function(reg){ return reg.pushManager.getSubscription(); })
    .then(function(s){ if (s) s.unsubscribe(); }).catch(function(){});
  return del;
}
function pushKinds(){ return pushSub().then(pushSave).catch(function(e){ st.pushNote = pushWhy(e); render(); }); }
function pushRenew(){   // phones replace their push address now and then; keep the saved one current
  if (!S.push || !pushCan()) return;
  if (Notification.permission !== "granted"){ S.push = false; saveS(); st.pushNote = "Notifications were turned off because this site lost permission to show them."; return; }
  myReg().then(function(reg){ return reg.pushManager.getSubscription(); }).then(function(s){
    if (!s) return pushSub().then(pushSave);
    if (s.endpoint !== S.pushEp || S.pushTerms !== TERMS.version || S.pushProject !== FB.projectId || Date.now() - S.pushAt > 7 * 864e5) return pushSave(s);
  }).catch(function(){});
}
function pushSample(){
  myReg().then(function(reg){
    var q = qty(1250, 12.5, 1);
    return reg.showNotification("Sample: RELIANCE long setup triggered 09:35", {body:"Long setup above ₹1,250.00, stop ₹1,237.50, suggested position " + q + ", target ₹1,268.75. For study only, not investment advice.",
      icon:"icon-192.png", badge:"badge-96.png", tag:"ob-sample", vibrate:[150, 80, 150], data:{url:"./?tab=live", tab:"live"}});
  }).catch(function(e){ toast(pushWhy(e)); });
}

/* ================================================================== profile: mandatory email sign-in, synced across devices
   Before anything else the person signs in or creates a profile, and confirms the email address through the link
   Firebase sends; only then come the terms, and only then the app. Opening Bell has its own Firebase project, so these
   sign-ins are separate from Fovea's. The profile (trade_profiles/{id}) holds capital settings, watchlists and paper
   trades, so they follow the person to any device. */
function signedIn(){ var c = cred(); return !!(c && c.email); }
function verified(){ var c = cred(); return !!(c && c.email && c.verified); }
var EMAIL_RE = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[A-Za-z]{2,}$/;
function authWhy(e){
  var m = String((e && e.message) || e || "");
  if (/EMAIL_EXISTS|CREDENTIAL_ALREADY_IN_USE/.test(m)) return "This email already has a profile. Use Sign in instead.";
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return "The email or password is not right.";
  if (/WEAK_PASSWORD/.test(m)) return "Use a password of at least 6 characters.";
  if (/INVALID_EMAIL|MISSING_EMAIL/.test(m)) return "That doesn't look like an email address.";
  if (/TOO_MANY_ATTEMPTS/.test(m)) return "Too many attempts. Wait a few minutes and try again.";
  if (/USER_DISABLED/.test(m)) return "This profile has been disabled.";
  if (/USER_NOT_FOUND|CREDENTIAL_TOO_OLD|TOKEN_EXPIRED|INVALID_ID_TOKEN|INVALID_REFRESH_TOKEN/.test(m)) return "Please sign in again.";
  return pushWhy(e);
}
function idCall(op, body){
  return fetch(ID_URL + "/accounts:" + op + "?key=" + FB.apiKey, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)}).then(jsonOrThrow);
}
function sendVerify(){ return fbAuth().then(function(a){ return idCall("sendOobCode", {requestType:"VERIFY_EMAIL", idToken:a.tok}); }); }
function checkVerified(){
  return fbAuth().then(function(a){ return idCall("lookup", {idToken:a.tok}); }).then(function(r){
    var u = r.users && r.users[0], v = !!(u && u.emailVerified), c = cred();
    if (v && c){ c.verified = true; setCred(c, fbTok, (fbExp - Date.now()) / 1000); }
    return v;
  });
}
function createProfile(email, pw){
  var c = cred(), body = {email:email, password:pw, returnSecureToken:true};
  // An older device id without an email keeps its records: Firebase links the email to it (accounts:signUp with the id token).
  var pre = c && c.uid && !c.email ? fbAuth().then(function(a){ body.idToken = a.tok; }).catch(function(){}) : Promise.resolve();
  return pre.then(function(){ return idCall("signUp", body); }).then(function(r){
    setCred({uid:r.localId, refresh:r.refreshToken, email:r.email}, r.idToken, +r.expiresIn);
    S.updatedAt = Date.now(); T.updatedAt = Date.now(); saveS(); saveT(false);
    return sendVerify();
  });
}
function signIn(email, pw){
  var before = cred(), oldPush = S.push, signed;
  return idCall("signInWithPassword", {email:email, password:pw, returnSecureToken:true}).then(function(r){
    signed = r;
    return oldPush && before && before.uid !== r.localId ? pushOff() : null;   // notifications move to the profile's id
  }).then(function(){
    setCred({uid:signed.localId, refresh:signed.refreshToken, email:signed.email}, signed.idToken, +signed.expiresIn);
    return checkVerified();
  }).then(function(v){
    if (v) return pullProfile(true);
  });
}
function resetPassword(email){
  return idCall("sendOobCode", {requestType:"PASSWORD_RESET", email:email});
}
function clearLocalProfile(){
  try { ["ob-settings", "ob-test"].forEach(function(k){ localStorage.removeItem(k); }); } catch(e){}
  S = Object.assign({}, DEF, {kinds:Object.assign({}, DEF.kinds), source:S.source});
  T = defaultT(); saveS();
}
function forget(){ try { localStorage.removeItem("ob-fb"); } catch(e){} fbTok = null; fbExp = 0; }
function signOut(){
  if (!confirm("Sign out on this device? Your profile stays saved; you'll need to sign in again to use Opening Bell.")) return;
  (S.push ? pushOff() : Promise.resolve()).then(function(){ forget(); clearLocalProfile(); st.pre = null; st.orb = null; gateStart(); });
}
function deleteProfile(){
  if (!confirm("Delete your profile? Your sign-in, capital settings, watchlists and paper trades are erased. This can't be undone.")) return;
  (S.push ? pushOff() : Promise.resolve()).then(function(){ return fsReq("DELETE", "trade_profiles/{uid}"); })
    .then(function(){ return fbAuth().then(function(a){ return idCall("delete", {idToken:a.tok}); }); })
    .then(function(){ forget(); clearLocalProfile(); st.pre = null; st.orb = null; toast("Profile deleted"); gateStart(); },
          function(e){ st.authNote = authWhy(e) + " Your profile was not deleted."; render(); });
}
var syncTimer = null;
function syncSoon(){ if (!signedIn()) return; clearTimeout(syncTimer); syncTimer = setTimeout(pushProfile, 1500); }
function profileFields(){
  return {settings:fv({capital:S.capital, risk:S.risk, maxpos:S.maxpos, lossR:S.lossR, kinds:S.kinds, updatedAt:S.updatedAt || 0}),
          test:fv(JSON.stringify(T)), updatedAt:fv(new Date())};
}
function pushProfile(){
  if (!signedIn()) return Promise.resolve();
  return fsReq("PATCH", "trade_profiles/{uid}", {fields:profileFields()}).catch(function(e){ st.authNote = authWhy(e); });
}
function pullProfile(force){
  if (!signedIn()) return Promise.resolve();
  return fsReq("GET", "trade_profiles/{uid}").then(function(doc){
    var f = doc.fields || {};
    if (f.settings){
      var rs_ = unfv(f.settings);
      if (force || (rs_.updatedAt || 0) > (S.updatedAt || 0)){
        ["capital", "risk", "maxpos", "lossR"].forEach(function(k){ if (ok(+rs_[k])) S[k] = +rs_[k]; });
        if (rs_.kinds) S.kinds = Object.assign({}, DEF.kinds, rs_.kinds);
        S.updatedAt = rs_.updatedAt || S.updatedAt; saveS();
      }
    }
    if (f.test){ try { T = mergeT(T, JSON.parse(unfv(f.test))); saveT(false); } catch(e){} }
    return pushProfile();
  }, function(e){
    if (/^404/.test(String(e.message))) return pushProfile();   // first sync: create it
    st.authNote = authWhy(e);
  }).then(function(){ render(); });
}

/* ================================================================== terms gate
   Shown every time the app opens (and after 30 minutes away). Nothing loads until the person ticks every box and
   presses "I accept". The first acceptance of each version requires scrolling to the end of the full text.
   Each acceptance is logged on the phone and in Firestore (trade_consents/{id} and its accepts log) with the
   version and a SHA-256 fingerprint of the exact text accepted. */
var TERMS = {version:"", hash:"", html:""};
var CHECKS = [["adult", "I am 18 years of age or older and competent to contract."],
              ["notAdvice", "I understand Opening Bell is a screener for market study only, not investment advice or a recommendation, and that the developer is not registered with SEBI."],
              ["ownRisk", "I alone am responsible for my trading decisions and any profit or loss. The developer is not responsible for them."],
              ["agree", "I have read and accept the Terms and Conditions and the Privacy Notice, and I will follow all applicable laws."]];
var started = false, gateRead = false;
function consentLog(){ try { return JSON.parse(localStorage.getItem("ob-consents") || "[]"); } catch(e){ return []; } }
function lockApp(){ document.body.classList.add("locked"); $("#gate").hidden = false; }
function unlockApp(){ document.body.classList.remove("locked"); $("#gate").hidden = true; $("#gate-body").innerHTML = ""; }
function sha256(text){
  if (!window.crypto || !crypto.subtle) return Promise.resolve("");
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function(b){
    return Array.from(new Uint8Array(b)).map(function(x){ return ("0" + x.toString(16)).slice(-2); }).join("");
  });
}
function loadTerms(){
  return fetch("terms.html", {cache:"no-cache"}).then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(t){
      var d = new DOMParser().parseFromString(t, "text/html"), art = d.getElementById("terms"), meta = d.querySelector('meta[name="terms-version"]');
      if (!art || !meta) throw new Error("terms page is incomplete");
      TERMS.version = meta.content; TERMS.html = art.innerHTML;
      return sha256(art.textContent.replace(/\s+/g, " ").trim()).then(function(h){ TERMS.hash = h; });
    });
}
/* every visit: 1 sign in (or create a profile), 2 a verified email, 3 the terms; then the app */
function gateStart(){
  lockApp();
  if (!signedIn()) return authShow("signin");
  if (!verified()) return verifyShow(false);
  termsStart();
}
function termsStart(){
  $("#gate-body").innerHTML = '<p class="muted">Loading the terms…</p>';
  loadTerms().then(gateShow, function(){
    $("#gate-body").innerHTML = '<h1 id="gate-h">The terms could not be loaded</h1><p class="lede">Opening Bell needs your acceptance of its terms before it runs. Connect to the internet and try again.</p>' +
      '<div class="gate-actions"><button class="btn" id="g-retry" type="button">Try again</button></div>';
    $("#g-retry").onclick = termsStart;
  });
}
var STEPS = '<p class="steps"><b>1</b> Sign in <span>›</span> <b>2</b> Verify email <span>›</span> <b>3</b> Accept terms</p>';
function stepsAt(n){ return STEPS.replace("<b>" + n + "</b>", '<b class="on">' + n + "</b>"); }
function authShow(mode, note){
  var create = mode === "create";
  $("#gate-body").innerHTML = stepsAt(1) +
    '<h1 id="gate-h">' + (create ? "Create your profile" : "Sign in to Opening Bell") + "</h1>" +
    '<p class="lede small">' + (create ? "Your profile keeps your capital settings, watchlists and paper trades on every device. We'll send a link to confirm your email." :
      "Sign in with the email and password of your Opening Bell profile. Opening Bell profiles are separate from Fovea.") + "</p>" +
    '<div class="seg-ctl" role="group"><button type="button" id="a-in" aria-pressed="' + !create + '">Sign in</button><button type="button" id="a-new" aria-pressed="' + create + '">Create profile</button></div>' +
    '<form class="stack glass tile" id="a-form" novalidate>' +
      '<label class="small muted" for="a-email">Email</label><input type="email" id="a-email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>' +
      '<label class="small muted" for="a-pw">Password' + (create ? " (6 or more characters)" : "") + '</label><input type="password" id="a-pw" autocomplete="' + (create ? "new-password" : "current-password") + '" minlength="6" required>' +
      (create ? '<label class="small muted" for="a-pw2">Password again</label><input type="password" id="a-pw2" autocomplete="new-password" minlength="6" required>' : "") +
      '<button class="btn gold" type="submit" id="a-go">' + (create ? "Create profile" : "Sign in") + "</button>" +
      (create ? "" : '<button class="linkish small muted" type="button" id="a-reset" style="align-self:flex-start">Forgot password</button>') +
    "</form>" +
    '<p class="form-err" id="a-err"' + (note ? "" : " hidden") + ">" + esc(note || "") + "</p>" +
    '<p class="gate-foot">Next you\'ll be asked to accept the <a href="terms.html" target="_blank" rel="noopener">Terms and Conditions</a>. Opening Bell is a screener for market study, not investment advice.</p>';
  var err = function(m){ var e = $("#a-err"); e.textContent = m; e.hidden = !m; };
  $("#a-in").onclick = function(){ authShow("signin"); };
  $("#a-new").onclick = function(){ authShow("create"); };
  var r = $("#a-reset");
  if (r) r.onclick = function(){
    var em = $("#a-email").value.trim();
    if (!EMAIL_RE.test(em)){ err("Type your email above first, then tap Forgot password."); return; }
    resetPassword(em).then(function(){ err(""); toast("If that email has a profile, a reset link is on its way"); }, function(e){ err(authWhy(e)); });
  };
  $("#a-form").onsubmit = function(e){
    e.preventDefault();
    var em = $("#a-email").value.trim(), pw = $("#a-pw").value, go = $("#a-go");
    if (!EMAIL_RE.test(em)) return err("Enter a valid email address, like name@example.com.");
    if (pw.length < 6) return err("The password needs at least 6 characters.");
    if (create && pw !== $("#a-pw2").value) return err("The two passwords don't match.");
    go.disabled = true; go.textContent = create ? "Creating…" : "Signing in…"; err("");
    (create ? createProfile(em, pw).then(function(){ verifyShow(true); })
            : signIn(em, pw).then(function(){ if (verified()) termsStart(); else verifyShow(false); }))
      .catch(function(e2){ go.disabled = false; go.textContent = create ? "Create profile" : "Sign in"; err(authWhy(e2)); });
  };
}
var verifyWait = 0;
function verifyShow(justSent){
  var c = cred() || {};
  $("#gate-body").innerHTML = stepsAt(2) +
    '<h1 id="gate-h">Confirm your email</h1>' +
    '<div class="glass tile"><p style="margin:0 0 8px">' + (justSent ? "We've sent a link to" : "Your email isn't confirmed yet. We sent a link to") + " <b>" + esc(c.email || "") + "</b>.</p>" +
      '<p class="muted small" style="margin:0">Open that email, tap the link, then come back here and tap <b>I\'ve confirmed</b>. If it isn\'t in your inbox, look in Spam or Promotions.</p>' +
      '<p class="muted small" style="margin:8px 0 0">It comes from <b>noreply@opening-bell-4fdc9.firebaseapp.com</b>. In Gmail, search <b>from:firebaseapp.com</b> or open <b>All mail</b>. It can take a few minutes.</p></div>' +
    '<p class="form-err" id="v-err" hidden></p>' +
    '<div class="gate-actions"><button class="btn gold" id="v-check" type="button">I\'ve confirmed</button></div>' +
    '<div class="inline" style="margin-top:10px"><button class="btn ghost small" id="v-resend" type="button">Send the link again</button>' +
      '<button class="btn ghost small" id="v-other" type="button">Use a different email</button></div>';
  var err = function(m){ var e = $("#v-err"); e.textContent = m; e.hidden = !m; };
  $("#v-check").onclick = function(){
    var b = $("#v-check"); b.disabled = true; b.textContent = "Checking…";
    checkVerified().then(function(v){
      if (v) return pullProfile(true).then(termsStart);
      b.disabled = false; b.textContent = "I've confirmed";
      err("Not confirmed yet. Tap the link in the email first, then try again.");
    }, function(e){ b.disabled = false; b.textContent = "I've confirmed"; err(authWhy(e)); });
  };
  $("#v-resend").onclick = function(){
    if (Date.now() - verifyWait < 60e3) return err("Please wait a minute before sending another link.");
    verifyWait = Date.now();
    sendVerify().then(function(){ err(""); toast("Link sent to " + (c.email || "your email")); }, function(e){ err(authWhy(e)); });
  };
  $("#v-other").onclick = function(){ forget(); authShow("create"); };
}
function gateShow(){
  var seenVersion = consentLog().some(function(c){ return c.terms === TERMS.version; });
  gateRead = seenVersion;
  $("#gate-body").innerHTML = stepsAt(3) +
    '<h1 id="gate-h">' + (seenVersion ? "Confirm before you continue" : "Terms and conditions") + "</h1>" +
    '<p class="lede small">' + (seenVersion ? "Each time you open Opening Bell, please confirm that you accept its terms." :
      "Please read the terms to the end. Opening Bell runs only after you accept them.") + "</p>" +
    '<div class="terms-box glass" id="g-terms" tabindex="0" aria-label="Terms and conditions">' + TERMS.html + "</div>" +
    '<div class="checks">' + CHECKS.map(function(c){
      return '<label class="check"><input type="checkbox" data-check="' + c[0] + '"><span>' + esc(c[1]) + "</span></label>"; }).join("") + "</div>" +
    '<div class="gate-actions"><button class="btn ghost" id="g-decline" type="button">Decline</button><button class="btn gold" id="g-accept" type="button" disabled></button></div>' +
    '<p class="gate-foot">Version ' + esc(TERMS.version) + '. <a href="terms.html" target="_blank" rel="noopener">Open the full terms in a new page</a>.</p>';
  var box = $("#g-terms"), acc = $("#g-accept");
  function update(){
    var all = Array.prototype.every.call(document.querySelectorAll("[data-check]"), function(x){ return x.checked; });
    acc.disabled = !(all && gateRead);
    acc.textContent = gateRead ? "I accept" : "Read to the end first";
  }
  box.onscroll = function(){ if (box.scrollTop + box.clientHeight >= box.scrollHeight - 24){ gateRead = true; update(); } };
  if (box.scrollHeight <= box.clientHeight + 24) gateRead = true;
  document.querySelectorAll("[data-check]").forEach(function(x){ x.onchange = update; });
  update();
  $("#g-decline").onclick = gateDeclined;
  acc.onclick = function(){
    var checks = {}; document.querySelectorAll("[data-check]").forEach(function(x){ checks[x.dataset.check] = x.checked; });
    recordAcceptance(checks, !seenVersion);
    unlockApp(); startApp();
  };
}
function gateDeclined(){
  $("#gate-body").innerHTML = '<h1 id="gate-h">Opening Bell can\'t run without your acceptance</h1>' +
    '<p class="lede">You declined the terms, so the app will not show any screens, setups, paper trades or notifications. You can close the app, or review the terms again.</p>' +
    '<div class="gate-actions"><button class="btn" id="g-review" type="button">Review the terms</button></div>';
  $("#g-review").onclick = gateShow;
}
function queueConsent(rec){
  var q; try { q = JSON.parse(localStorage.getItem("ob-consent-q") || "[]"); } catch(e){ q = []; }
  q.push(rec); try { localStorage.setItem("ob-consent-q", JSON.stringify(q.slice(-50))); } catch(e){}
}
function recordAcceptance(checks, firstForVersion){
  var rec = {terms:TERMS.version, termsHash:TERMS.hash, at:new Date().toISOString(), checks:checks, readToEnd:gateRead,
             firstForVersion:firstForVersion, app:inAndroidApp() ? "android" : standalone() ? "installed" : "browser",
             device:isIOS() ? "iPhone" : /Android/.test(navigator.userAgent) ? "Android" : "Computer", tz:"Asia/Kolkata"};
  var log = consentLog(); log.unshift(rec);
  try { localStorage.setItem("ob-consents", JSON.stringify(log.slice(0, 50))); } catch(e){}
  queueConsent(rec);
  flushConsents();
}
/* send queued acceptances to Firestore; anything that fails stays queued for the next open */
function flushConsents(){
  var q; try { q = JSON.parse(localStorage.getItem("ob-consent-q") || "[]"); } catch(e){ q = []; }
  if (!q.length) return Promise.resolve();
  return fbAuth().then(function(a){
    var base = FS_DOCS + "trade_consents/" + a.uid;
    var hdr = {"Content-Type":"application/json", Authorization:"Bearer " + a.tok};
    var chain = Promise.resolve();
    q.forEach(function(rec){
      chain = chain.then(function(){
        var f = {}; Object.keys(rec).forEach(function(k){ f[k] = fv(k === "at" ? new Date(rec.at) : rec[k]); });
        return fetch(base + "/accepts", {method:"POST", headers:hdr, body:JSON.stringify({fields:f})}).then(jsonOrThrow)
          .then(function(){ return fetch(base + "?updateMask.fieldPaths=terms&updateMask.fieldPaths=termsHash&updateMask.fieldPaths=lastAcceptedAt&updateMask.fieldPaths=device&updateMask.fieldPaths=app",
            {method:"PATCH", headers:hdr, body:JSON.stringify({fields:{terms:f.terms, termsHash:f.termsHash, lastAcceptedAt:f.at, device:f.device, app:f.app}})}).then(jsonOrThrow); })
          .then(function(){
            var cur; try { cur = JSON.parse(localStorage.getItem("ob-consent-q") || "[]"); } catch(e){ cur = []; }
            cur = cur.filter(function(x){ return x.at !== rec.at; });
            try { localStorage.setItem("ob-consent-q", JSON.stringify(cur)); } catch(e){}
          });
      });
    });
    return chain;

/* ---- Plan: market, sectors, results, checklist */
/* A plain-language reading of the Plan page's figures: trend, today's move, banks, volatility, flows, world markets,
   sectors, then the balance of signals and the level that would change it. Rule-based text, not advice. */
function assessment(p, L){
  var r = p.regime || {}, out = [], score = 0, signals = 0, li = L && L.indices || {};
  var live = L && (L.phase === "open" || L.phase === "preopen" || L.phase === "closed") && li["NIFTY 50"] && ok(li["NIFTY 50"].last);
  var f1 = function(x){ return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(1) + "%"; }, f2 = function(x){ return (x > 0 ? "+" : x < 0 ? "−" : "") + Math.abs(x).toFixed(2) + "%"; };
  var vote = function(v){ signals++; score += v; };
  if (!ok(r.nifty)) return "";

  // 1. trend
  var e20 = ok(r.nifty_vs20) ? r.nifty / (1 + r.nifty_vs20 / 100) : null, e50 = ok(r.nifty_vs50) ? r.nifty / (1 + r.nifty_vs50 / 100) : null;
  var t = "At the last close Nifty was " + n(r.nifty) + ", " + (r.nifty_vs20 >= 0 ? "above" : "below") + " its 20-day average by " + Math.abs(r.nifty_vs20).toFixed(1) + "% and " +
    (r.nifty_vs50 >= 0 ? "above" : "below") + " its 50-day by " + Math.abs(r.nifty_vs50).toFixed(1) + "%" + (ok(r.nifty_ret5) ? ", " + f1(r.nifty_ret5) + " over the last 5 sessions" : "") + ". ";
  if (r.label === "Uptrend"){ t += "Short- and medium-term trends point up: dips have been getting bought."; vote(2); }
  else if (r.label === "Downtrend"){ t += "Both trends point down: rallies are more likely to be sold until the index gets back above its 20-day average."; vote(-2); }
  else { t += r.nifty_vs20 >= 0 && r.nifty_vs50 < 0 ? "Price has bounced above the 20-day but is still under the 50-day: a recovery that isn't confirmed yet." :
                r.nifty_vs20 < 0 && r.nifty_vs50 >= 0 ? "Price has slipped under the 20-day while holding the 50-day: a pullback inside a larger uptrend, so far." :
                "The averages are tangled: no clear trend, so moves tend to fade."; vote(r.nifty_vs50 >= 0 ? 0.5 : -0.5); }
  out.push(t);

  // 2. today's move and breadth (live) or the last session's
  var nn = live ? li["NIFTY 50"] : null, nchg = nn ? nn.chg : r.nifty_chg, bk = live && li["BANK NIFTY"] ? li["BANK NIFTY"].chg : r.bank_chg;
  t = "";

  else if (live) t += "Today Nifty closed " + f2(nn.chg) + " at " + n(nn.last) + ". ";
  if (L && L.breadth && (L.breadth.adv + L.breadth.dec) > 20){
    var a = L.breadth.adv, d = L.breadth.dec, share = a / (a + d);
    t += a + " F&O stocks are up and " + d + " down: " + (share >= 0.65 ? "broad buying, the move has wide support." : share <= 0.35 ? "broad selling, most stocks are falling with the index." : "a mixed tape, stock picking matters more than the index.") + " ";
    vote(share >= 0.65 ? 1 : share <= 0.35 ? -1 : 0);
  } else if (p.preopen && String(p.generated).slice(0, 10) === p.date){
    t += "In the pre-open " + p.preopen.adv + " F&O stocks were indicated higher and " + p.preopen.dec + " lower (average " + f2(p.preopen.avg) + "). ";
  }
  if (ok(bk) && ok(nchg)){
    var gap = bk - nchg;
    t += Math.abs(gap) < 0.3 ? "Bank Nifty moved in line with Nifty (" + f2(bk) + ")." :
      gap < 0 ? "Bank Nifty did worse (" + f2(bk) + " against " + f2(nchg) + "): banks, which carry a large weight in Nifty, are dragging on the index." :
                "Bank Nifty did better (" + f2(bk) + " against " + f2(nchg) + "): banks are supporting the index.";
    if (Math.abs(gap) >= 0.3) vote(gap > 0 ? 0.5 : -0.5);
  }
  if (t) out.push(t);

  // 3. volatility
  var vx = live && li["INDIA VIX"] ? li["INDIA VIX"].last : r.vix, vc = live && li["INDIA VIX"] ? li["INDIA VIX"].chg : r.vix_chg;
  if (ok(vx)){
    var lvl = vx < 12 ? "very low: a calm market, where breakouts often lack follow-through" : vx < 15 ? "low to normal" : vx < 18 ? "normal" : vx < 22 ? "elevated: expect wider swings" : "high: a fearful market with large swings both ways";
    t = "India VIX is " + vx.toFixed(2) + (ok(vc) ? " (" + f1(vc) + ")" : "") + ", " + lvl + ". ";
    if (ok(vc) && vc >= 5) t += "The quick rise shows growing nervousness; options are pricing bigger moves, so stops need room and positions should be smaller.";
    else if (ok(vc) && vc <= -5) t += "It is easing quickly, which usually goes with steadier prices.";
    out.push(t);
    vote(vx >= 22 || (ok(vc) && vc >= 5) ? -0.5 : vx < 15 && ok(vc) && vc < 0 ? 0.5 : 0);
  }

  // 4. institutional flows
  var fl = {}; (p.fii_dii || []).forEach(function(f){ fl[/FII|FPI/i.test(f.category) ? "fii" : /DII/i.test(f.category) ? "dii" : "x"] = f; });
  if (fl.fii && fl.dii && ok(fl.fii.net_cr) && ok(fl.dii.net_cr)){

    t = "On " + esc(fl.fii.date || "the last session") + " foreign investors " + (fi >= 0 ? "bought " : "sold ") + cr(fi) + " and domestic institutions " + (di >= 0 ? "bought " : "sold ") + cr(di) + " in cash shares. ";
    t += fi >= 0 && di >= 0 ? "Buying from both is supportive." :
         fi < 0 && di >= 0 ? (di >= -fi ? "Domestic buying more than absorbed the foreign selling, which tends to cushion falls." : "Domestic buying absorbed only part of the foreign selling: net pressure stays on large caps.") :
         fi >= 0 && di < 0 ? "Foreign buying with domestic selling: often a sign of foreign money returning." : "Both selling: a weak backdrop.";
    if (Math.abs(fi) < 500 && Math.abs(di) < 500) t += " The amounts are small, so flows aren't a strong signal today.";

  }

/* ---- Track record: how the screener's own setups worked out (track.json, built on GitHub by track.py) */
function fmtR(r){ return ok(r) ? (r > 0 ? "+" : r < 0 ? "−" : "") + Math.abs(r).toFixed(2) + "R" : "–"; }
function trackPages(kind){
  var T_ = st.track && st.track[kind], intra = kind === "intraday", name = intra ? "Intraday" : "Swing";
  if (!T_) return [page(name + " track record", '<div class="empty"><p>The track record builds up from the first trading day with the live scan. It updates every 15 minutes in market hours and after the close.</p></div>')];
  var R = T_.recent || {}, A = T_.archive || {}, days = intra ? 7 : 30;
  var fin = (R.profit || 0) + (R.loss || 0);
  var facts = [["Signals", n(R.signals)], ["Triggered", n(R.triggered)], ["Profitable", '<span class="up">' + n(R.profit) + "</span>"],
               ["Loss", '<span class="down">' + n(R.loss) + "</span>"], ["Open", n(R.open)],
               ["Win rate", fin ? Math.round(R.profit / fin * 100) + "%" : "–"], ["Total", '<span class="' + tone(R.r) + '">' + fmtR(R.r) + "</span>"],
               ["Average", '<span class="' + tone(R.r) + '">' + (fin ? fmtR(R.r / (fin + (R.flat || 0))) : "–") + "</span>"]];
  if (!intra) facts.splice(5, 0, ["Not triggered", n(R.not_triggered)]);
  var byDay = Object.keys(T_.by_day || {}).sort().reverse().map(function(d){
    var x = T_.by_day[d];
    return "<tr><td>" + esc(niceDate(d)) + "</td><td>" + n(x.signals) + "</td><td>" + n(x.triggered) + '</td><td class="up">' + n(x.profit) + '</td><td class="down">' + n(x.loss) + '</td><td class="' + tone(x.r) + '">' + fmtR(x.r) + "</td></tr>";
  }).join("");
  var older = A.triggered || A.signals ? '<div class="glass tile"><b>Before ' + esc(niceDate(A.to)) + " (counts only)</b>" +
      '<div class="facts" style="margin-top:6px"><div class="fact"><b>' + n(A.triggered) + "</b><span>Triggered of " + n(A.signals) + '</span></div><div class="fact"><b class="up">' + n(A.profit) +
      '</b><span>Profitable</span></div><div class="fact"><b class="down">' + n(A.loss) + '</b><span>Loss</span></div><div class="fact"><b class="' + tone(A.r) + '">' + fmtR(A.r) + "</b><span>Total</span></div></div></div>" :
    '<p class="note">Setups are kept in detail for ' + days + " days; after that only the counts are kept, here.</p>";
  var head = '<div class="glass tile"><div class="facts">' + facts.map(function(f){ return '<div class="fact"><b>' + f[1] + "</b><span>" + esc(f[0]) + "</span></div>"; }).join("") + "</div>" +
      '<p class="muted small" style="margin:8px 0 0">Last ' + days + " days. " + esc((st.track.rules || {})[kind] || "") + " R is the stop distance; the cautious reading is used when a stop and a target fall in the same bar.</p></div>" +
    (byDay ? '<div class="glass tile"><table class="trk"><thead><tr><th>Day</th><th>Signals</th><th>Trig.</th><th>Profit</th><th>Loss</th><th>Total</th></tr></thead><tbody>' + byDay + "</tbody></table></div>" : "") +
    older + '<p class="note">Rule outcomes on past prices for market study: not trades anyone made, and not a promise of future results. Updated ' + esc(niceDate(st.track.updated)) + " " + esc(hmOf(st.track.updated)) + ".</p>";
  var trades = (T_.trades || []).filter(function(t){ return intra || t.trig || t.outcome === "Not triggered" || t.outcome === "Waiting"; });
  var cards = trades.map(function(t){
    var entry = t.fill || t.entry, risk = Math.abs(entry - t.stop), pct = risk && entry ? t.r * risk / entry * 100 : null;
    var cls = !t.trig ? "" : !t.done ? "gold" : t.r > 0 ? "up" : t.r < 0 ? "down" : "";
    var lbl = !t.trig ? t.outcome : t.done ? (t.r > 0 ? "Profit " : t.r < 0 ? "Loss " : "Flat ") + fmtR(t.r) : "Open " + fmtR(t.r);
    return '<div class="stock glass"><div class="head"><span><span class="sym">' + esc(t.sym) + '</span><span class="side ' + (t.side === "short" ? "short" : "long") + '">' + (intra ? (t.side === "short" ? "Short" : "Long") : esc(t.setup)) + "</span>" +
        '<span class="ind">' + esc(niceDate(t.d)) + (t.trig ? (intra ? ", triggered " + esc(t.trig) : ", triggered " + esc(niceDate(t.trig))) : "") + "</span></span>" +
        '<span class="pill ' + cls + '">' + esc(lbl) + "</span></div>" +
      (t.trig ? '<div class="levels"><div><span>' + (t.fill && t.fill !== t.entry ? "Filled (gap)" : "Entry") + "</span><b>" + rs(entry) + "</b></div><div><span>Stop</span><b>" + rs(t.stop) + "</b></div>" +
        "<div><span>Exit" + (t.done ? "" : " (now)") + "</span><b>" + (ok(t.exit) ? rs(t.exit) : "–") + "</b></div><div><span>" + (intra ? "Target 1.5R" : "Target 2R") + "</span><b>" + rs(t.t1) + "</b></div>" +
        "<div><span>Target 3R</span><b>" + rs(t.t2) + '</b></div><div><span>Result</span><b class="' + tone(t.r) + '">' + fmtR(t.r) + (ok(pct) ? " (" + pc(pct) + ")" : "") + "</b></div></div>" +
        '<p class="why">' + esc(t.outcome) + (!intra && t.held ? ", " + t.held + (t.held === 1 ? " session" : " sessions") : "") + ".</p>"
      : '<p class="why">Setup above ' + rs(t.entry) + ", stop " + rs(t.stop) + "." + (t.outcome === "Waiting" ? " Watching for 3 sessions." : " Price never reached the level within 3 sessions.") + "</p>") + "</div>";
  });
  var pages = [page(name + " track record", head)];
  chunk(cards, 3).forEach(function(c, k, all){ pages.push(page(name + " setups " + (k + 1) + "/" + all.length, c.join(""), trades.length)); });
  return pages;
}

/* Analyse: a stock checked against every screener rule (computed on GitHub with the screener's own code) */

/* every other NSE and BSE stock: market/index.json (names, for search), market/rules.json, market/s/<letter>.json */
function loadMarket(){

    MK.index = r[0]; MK.rules = r[1]; MK.bySym = {}; MK.loading = null;

/* type-ahead: stocks whose symbol or company name starts with what's typed (any word of the name) */
function stockRows(){
  var rows = MK.index ? MK.index.stocks.slice() : [], have = {};
  rows.forEach(function(x){ have[x[0]] = 1; });
  universe().forEach(function(sym){ if (!have[sym]) rows.push([sym, null, "NSE F&O", "fno"]); });
  return rows;
}
function suggest(q, fnoOnly){
  var Q = String(q || "").trim().toUpperCase(); if (!Q) return [];
  var out = [], uni = fnoOnly ? universe() : null;
  stockRows().forEach(function(x){
    if (uni && uni.length && uni.indexOf(x[0]) < 0) return;   // watchlists: stocks the app has prices for
    var sym = x[0], name = String(x[1] || "").toUpperCase(), rank = -1;
    if (sym === Q) rank = 0;
    else if (sym.indexOf(Q) === 0) rank = 1;
    else if (name.indexOf(Q) === 0) rank = 2;
    else if (Q.length >= 2 && (" " + name).indexOf(" " + Q) >= 0) rank = 3;
    if (rank >= 0) out.push([rank, x]);
  });
  out.sort(function(a, b){ return a[0] - b[0] || (a[1][3] === "fno" ? 0 : 1) - (b[1][3] === "fno" ? 0 : 1) || a[1][0].length - b[1][0].length || (a[1][0] < b[1][0] ? -1 : 1); });
  return out.slice(0, 8).map(function(r){ return r[1]; });
}
function hl(text, Q){   // bold the typed start of the symbol or of a word in the name
  var t = String(text || ""), U = t.toUpperCase(), i = U.indexOf(Q) === 0 ? 0 : U.indexOf(" " + Q) >= 0 ? U.indexOf(" " + Q) + 1 : -1;
  return i < 0 || !Q ? esc(t) : esc(t.slice(0, i)) + "<b>" + esc(t.slice(i, i + Q.length)) + "</b>" + esc(t.slice(i + Q.length));
}
function wireSuggest(){
  var inp = $("#an-sym"), box = $("#an-sugg"); if (!inp || !box) return;
  function draw(){

    box.innerHTML = rows.map(function(x){
      return '<button type="button" role="option" data-sugg="' + esc(x[0]) + '"><span class="sym">' + hl(x[0], Q) + "</span>" +

/* a typed name or symbol to symbols: exact symbol first, then company names */
function findStocks(q){
  var Q = q.toUpperCase(), out = [];
  if (MK.bySym && MK.bySym[Q]) return [Q];
  if (universe().indexOf(Q) >= 0) return [Q];
  if (!MK.index) return [Q];
  var words = Q.replace(/\b(LTD|LIMITED|INDIA)\b\.?/g, " ").split(/\s+/).filter(Boolean);
  MK.index.stocks.forEach(function(x){
    var name = String(x[1] || "").toUpperCase();
    if (x[0].indexOf(Q) === 0 || (" " + name).indexOf(" " + Q) >= 0 || (words.length && words.every(function(w){ return (" " + name).indexOf(" " + w) >= 0; }))) out.push(x[0]);
  });

/* checks with data that are met, out of all checks with data (required rules and ranking factors) */
function scoreOf(g){

  var met = have.filter(function(i){ return i[1] === true; }).length;

}
