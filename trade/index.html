/* add to / remove from the current watchlist straight from its page */
function addToList(sym){
  var l = curList(), uni = universe(); sym = String(sym || "").trim().toUpperCase();
  if (!sym) return false;
  if (uni.length && uni.indexOf(sym) < 0){ toast(sym + " isn't in the F&O list the app has prices for."); return false; }
  if (l.symbols.indexOf(sym) >= 0){ toast(sym + " is already in " + l.name + "."); return false; }
  if (l.symbols.length >= MAX_STOCKS){ toast(l.name + " is full: remove a stock first."); return false; }
  l.symbols.push(sym); l.updatedAt = Date.now(); touchT(); toast("Added " + sym + " to " + l.name + "."); render();
  setTimeout(function(){ var f = $("#wl-q"); if (f) f.focus(); }, 60);
  return true;
}
function removeFromList(sym){
  var l = curList(), n_ = T.trades.filter(function(t){ return t.listId === l.id && t.symbol === sym; }).length;
  if (n_ && !confirm("Remove " + sym + " from " + l.name + "? Its " + n_ + (n_ === 1 ? " paper trade stays" : " paper trades stay") + " in your results.")) return;
  l.symbols = l.symbols.filter(function(x){ return x !== sym; }); l.updatedAt = Date.now(); touchT(); toast("Removed " + sym + " from " + l.name + "."); render();
}
function wireWatchAdd(){
  var inp = $("#wl-q"), box = $("#wl-sugg"), form = $("#wl-add"); if (!inp || !box || !form) return;
  var l = curList();
  function draw(){
    var Q = inp.value.trim().toUpperCase(), rows = suggest(Q, true);
    if (!rows.length){ box.hidden = true; box.innerHTML = ""; return; }
    box.innerHTML = rows.map(function(x){
      var have = l.symbols.indexOf(x[0]) >= 0;
      return '<button type="button" role="option" data-wladd="' + esc(x[0]) + '"' + (have ? " disabled" : "") + '><span class="sym">' + hl(x[0], Q) + "</span>" +
        '<span class="nm">' + (x[1] ? hl(x[1], Q) : "") + '</span><span class="ex">' + (have ? "Added" : '<b class="add">+ Add</b>') + "</span></button>";
    }).join("");
    box.hidden = false;
    box.querySelectorAll("[data-wladd]").forEach(function(b){
      b.onmousedown = function(e){ e.preventDefault(); };
      b.onclick = function(){ if (addToList(b.dataset.wladd)) inp.value = ""; };
    });
  }
  inp.oninput = draw;
  inp.onfocus = function(){ loadMarket().then(draw, function(){}); draw(); };
  inp.onblur = function(){ setTimeout(function(){ box.hidden = true; }, 150); };
  form.onsubmit = function(e){
    e.preventDefault();
    var Q = inp.value.trim().toUpperCase(), rows = suggest(Q, true);
    var pick = rows.filter(function(x){ return x[0] === Q; })[0] || (rows.length === 1 ? rows[0] : null);

  };
}

      T.trades.filter(function(t){ return t.listId === l.id; }).forEach(function(t){ T.deleted.push(t.id); });

      if (!confirm("Delete " + l.name + (cnt ? " and its " + cnt + " paper trades" : "") + "?")) return;
      T.deleted.push(l.id); T.trades.filter(function(t){ return t.listId === l.id; }).forEach(function(t){ T.deleted.push(t.id); });
      T.trades = T.trades.filter(function(t){ return t.listId !== l.id; }); T.lists = T.lists.filter(function(y){ return y.id !== l.id; });
      st.list = T.lists[0].id; touchT(); closeSheet(); render();
    };
  }
  draw();
}

      '<label class="full">Note (optional)<input type="text" name="note" maxlength="140" value="' + esc(pre.note || "") + '"></label>' +

       "Sent from GitHub on trading days, even when the app is closed.") +
    '</small></label><button class="switch" id="s-push" type="button" role="switch" aria-checked="' + !!S.push + '" aria-label="Notifications on this phone"' + (st.pushBusy ? " disabled" : "") + "></button></div>" +
    (S.push ? KINDS.map(function(k){
      return '<div class="field sub"><label for="k-' + k[0] + '">' + k[1] + "<small>" + k[2] + '</small></label><button class="switch" id="k-' + k[0] +
        '" data-kind="' + k[0] + '" type="button" role="switch" aria-checked="' + !!S.kinds[k[0]] + '" aria-label="' + k[1] + '"></button></div>';
    }).join("") : "") + "</div>" +
    (st.pushNote ? '<div class="warn">' + esc(st.pushNote) + "</div>" : "") +
    (S.push ? '<div class="inline"><button class="btn ghost small" id="s-sample" type="button">Show a sample</button></div>' +
      '<p class="note">On Xiaomi, Oppo, Vivo or Realme phones, allow Chrome (or the Opening Bell app) to run in the background so breakout alerts aren\'t delayed.</p>' : "");

  var getApp = getAppHtml("s");
  var app = '<div class="glass tile">' + getApp + "</div>" +
    '<div class="glass tile"><div class="field"><label for="s-demo">Sample data<small>Made-up prices for trying the app.</small></label><button class="switch" id="s-demo" type="button" role="switch" aria-checked="' + (S.source === "demo") + '" aria-label="Sample data"></button></div></div>' +
    '<p class="note">The screener runs on GitHub every weekday: the full screen at about 9:12 AM, the live scan every 5 minutes from 9:30 to 11:00, the square-off reminder at 3:15 and a preview around 7 PM. ' +
    "It reads NSE (F&amp;O list, open interest, flows, results, pre-open) and Yahoo Finance (prices).</p>";

  var last = consentLog()[0];
  var terms = '<div class="glass tile"><p style="margin:0 0 8px">' + (last ? "You accepted version " + esc(last.terms) + " on " + esc(new Date(last.at).toLocaleString("en-IN", {dateStyle:"medium", timeStyle:"short", timeZone:"Asia/Kolkata"})) + ". " : "") +
      'Opening Bell is a screener for market study, not investment advice. The developer is not registered with SEBI. <a href="terms.html" target="_blank" rel="noopener">Read the terms and privacy notice</a>.</p></div>' +
    '<div class="glass tile"><div class="field"><label>Withdraw consent<small>Turns off notifications, clears this phone\'s settings and paper trades, and stops the app until you accept again.</small></label>' +
    '<button class="btn ghost small" id="s-withdraw" type="button">Withdraw</button></div></div>';

  var gloss = '<div class="glass tile"><input type="search" id="gl-q" placeholder="Search terms, e.g. VWAP or stop" autocomplete="off" style="width:100%">' +
    '<p class="muted small" style="margin:6px 0 0">' + GLOSSARY.length + " terms used in the app, in plain words.</p></div>" +
    '<div class="glass tile" id="gl-list">' + glossaryHTML("") + "</div>";
  return [page("Profile", prof), page("Capital", capital), page("Notifications", notif), page("App and data", app), page("Glossary", gloss), page("Terms and privacy", terms)];
}

/* ================================================================== events */
var bip = null;
addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); bip = e; if (st.tab === "settings") render(); });
function getAppHtml(pre){
  if (inAndroidApp()) return '<p style="margin:0">You are using the Opening Bell Android app. Updates arrive automatically with the website.</p>';
  if (isIOS()) return '<p style="margin:0">On iPhone or iPad: open this page in Safari, tap Share, then <b>Add to Home Screen</b>. Open Opening Bell from the new icon.</p>';
  return '<div class="field"><label>Android app<small>For Android phones and tablets. Installs Opening Bell with its own icon and notifications.</small></label>' +
    '<button class="btn gold" data-apk="1" type="button">Download</button></div><p class="note apk-note" hidden></p>' +
    '<p class="note" style="margin-bottom:0">On a computer, or to skip the download: ' + (bip ? '<button class="linkish" data-install="1" type="button">add Opening Bell to this device</button>' :
      "use your browser's menu and choose <b>Install app</b> or <b>Add to Home screen</b>") + ".</p>";
}
function showGetApp(){
  openSheet("<h3>Get the Opening Bell app</h3>" + getAppHtml("g") +
    '<div class="gate-actions"><button class="btn ghost" type="button" id="ga-close">Close</button></div>');
  $("#ga-close").onclick = closeSheet;
  bindGetApp();
}
function bindGetApp(){
  document.querySelectorAll("[data-apk]").forEach(function(b){ b.onclick = apkGet; });
  document.querySelectorAll("[data-install]").forEach(function(b){ b.onclick = function(){ if (bip){ bip.prompt(); bip = null; closeSheet(); render(); } }; });
}
function apkGet(){
  var p = document.querySelector("#sheet:not([hidden]) .apk-note") || $(".apk-note");
  if (p){ p.textContent = "The app is downloading. When it finishes, open OpeningBell.apk from your notifications or Downloads and tap Install. If Android asks, allow installing from this browser."; p.hidden = false; }
  toast("Downloading Opening Bell…");
  location.href = APK_URL;
}
function bindView(){
  var x;
  document.querySelectorAll("[data-open]").forEach(function(b){
    b.onclick = function(){ var lv = $("#lv" + b.dataset.open), open = lv.hidden; lv.hidden = !open; b.setAttribute("aria-expanded", open); };
  });
  document.querySelectorAll("[data-side]").forEach(function(b){ b.onclick = function(){ st.side = b.dataset.side; render(); }; });
  document.querySelectorAll("[data-swing]").forEach(function(b){ b.onclick = function(){ st.swing = b.dataset.swing; render(); }; });
  document.querySelectorAll("[data-liveview]").forEach(function(b){ b.onclick = function(){ st.liveView = b.dataset.liveview; render(); }; });
  document.querySelectorAll("[data-practice]").forEach(function(b){ b.onclick = function(){ practiceFrom(b.dataset.practice); }; });
  if ((x = $("#tryDemo"))) x.onclick = function(){ S.source = "demo"; saveS(); load(); };
  [["s-capital","capital"],["s-risk","risk"],["s-maxpos","maxpos"],["s-loss","lossR"]].forEach(function(p){
    var el = document.getElementById(p[0]); if (!el) return;
    el.onchange = function(){ var v = parseFloat(el.value); if (ok(v) && v > 0){ S[p[1]] = v; changedS(); render(); } else el.value = S[p[1]]; };
  });
  if ((x = $("#s-push"))) x.onclick = function(){ if (S.push) pushOff(); else pushOn(); };
  document.querySelectorAll("[data-kind]").forEach(function(b){
    b.onclick = function(){ S.kinds[b.dataset.kind] = !S.kinds[b.dataset.kind]; changedS(); render(); pushKinds(); };
  });
  if ((x = $("#s-sample"))) x.onclick = pushSample;
  if ((x = $("#s-demo"))) x.onclick = function(){ S.source = S.source === "demo" ? "live" : "demo"; saveS(); load(); };
  bindGetApp();
  if ((x = $("#s-withdraw"))) x.onclick = withdraw;
  // profile
  if ((x = $("#p-out"))) x.onclick = signOut;
  if ((x = $("#p-del"))) x.onclick = deleteProfile;
  // test
  document.querySelectorAll("[data-list]").forEach(function(b){ b.onclick = function(){ st.list = b.dataset.list; render(); }; });
  if ((x = $("#t-newlist"))) x.onclick = function(){
    if (T.lists.length >= MAX_LISTS) return;
    var name = (prompt("Name for the new watchlist", "Watchlist " + (T.lists.length + 1)) || "").trim().slice(0, 30); if (!name) return;
    var l = {id:uid(), name:name, symbols:[], updatedAt:Date.now()}; T.lists.push(l); st.list = l.id; touchT(); render();
  };
  if ((x = $("#t-manage"))) x.onclick = manageList;
  wireWatchAdd();
  document.querySelectorAll("[data-wldel]").forEach(function(b){ b.onclick = function(){ removeFromList(b.dataset.wldel); }; });
  document.querySelectorAll("[data-analyse]").forEach(function(b){ b.onclick = function(){ analyse(b.dataset.analyse); }; });
  if ((x = $("#an-form"))) x.onsubmit = function(e){ e.preventDefault(); analyse($("#an-sym").value); };
  wireSuggest();
  if ((x = $("#gl-q"))) x.oninput = function(){ $("#gl-list").innerHTML = glossaryHTML(this.value); };
  document.querySelectorAll("[data-trade]").forEach(function(b){ b.onclick = function(){ tradeForm({symbol:b.dataset.trade, listId:st.list}); }; });
  document.querySelectorAll("[data-closetrade]").forEach(function(b){ b.onclick = function(){ closeForm(b.dataset.closetrade); }; });
  document.querySelectorAll("[data-edittrade]").forEach(function(b){ b.onclick = function(){
    var t = T.trades.filter(function(y){ return y.id === b.dataset.edittrade; })[0]; tradeForm(Object.assign({}, t)); }; });
  document.querySelectorAll("[data-deltrade]").forEach(function(b){ b.onclick = function(){
    if (!confirm("Delete this paper trade?")) return;
    T.deleted.push(b.dataset.deltrade); T.trades = T.trades.filter(function(t){ return t.id !== b.dataset.deltrade; }); touchT(); render(); }; });
  if ((x = $("#t-export"))) x.onclick = exportT;
  var imp = $("#t-import"); if (imp) imp.onchange = function(){ if (imp.files[0]) importT(imp.files[0]); };
}
function setTab(name){
  if (!/^(plan|intraday|live|swing|test|settings)$/.test(name || "")) return;
  st.tab = name;
  document.querySelectorAll("nav.tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x.dataset.tab === name); });
  render();
  if (name === "test") loadTestPrices();
}
document.querySelectorAll("nav.tabs [data-tab]").forEach(function(b){ b.onclick = function(){ setTab(b.dataset.tab); }; });
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", function(e){
  var m = e.data || {};
  if (m.type === "ob-open") setTab(m.tab);
  if (m.type === "ob-push" && !st.loading) load();
});
/* Refresh: drop everything held in memory and fetch the newest of everything GitHub has: the screen, the live scan,
   prices for paper trades, the rule checks and your profile. Then say what's new and when the next update is due. */
function hardRefresh(){
  var btn = $("#reload"); if (st.refreshing) return;
  st.refreshing = true; btn.disabled = true; btn.textContent = "Checking…";
  var before = {pre:st.pre && st.pre.generated, orb:st.orb && st.orb.generated, live:st.live && st.live.generated, day:st.day};
  PX.reset(); AN.data = null; MK.index = null; MK.rules = null; MK.bySym = null; MK.shards = {};
  var wait = st.loading ? new Promise(function(res){ var k = setInterval(function(){ if (!st.loading){ clearInterval(k); res(); } }, 150); }) : Promise.resolve();
  wait.then(function(){
    return Promise.all([load(st.day === st.latest ? null : st.day), pullProfile(false).catch(function(){})]);
  }).then(function(){
    st.refreshing = false; btn.disabled = false; btn.textContent = "Refresh";
    if (st.error) return toast("Couldn't reach the data. Check the connection; showing what was loaded before.");
    if (st.noData) return toast("No data published yet.");
    var fresh = (st.pre && st.pre.generated) !== before.pre || (st.orb && st.orb.generated) !== before.orb || (st.live && st.live.generated) !== before.live || st.day !== before.day;
    var parts = [];
    if (st.pre) parts.push((st.pre.date > ist().date ? "Preview" : "Screen") + " " + hmOf(st.pre.generated));
    if (st.orb) parts.push("breakout scan " + hmOf(st.orb.generated));
    if (st.live) parts.push("live prices " + liveHM());
    toast((fresh ? "Updated: " : "Already the latest: ") + parts.join(", ") + "." + nextUpdate() + (GH.limited ? " GitHub is limiting checks from this network, so data can be up to a few minutes behind." : ""));
  });
}
/* when GitHub is due to publish next (IST), for the Refresh message */
function nextUpdate(){
  var t = ist(), m = t.mins; if (t.weekend) return " Next update Monday about 9:10.";
  if (m < 540) return " Live prices from 9:00, today's screen about 9:10.";
  if (m < 550) return " Live prices every minute; today's screen about 9:10.";
  if (m < 571) return " Live scans start about 9:32.";
  if (m < 662) return " Live prices every minute; breakout scans every 5 minutes until 11:00.";
  if (m < 931) return " Live prices every minute until 3:30.";
  if (m < 1140) return " Next: the 3:15 reminder, then the evening preview about 7:10.";
  return " Next: tomorrow's screen about 9:10.";
}
$("#reload").onclick = hardRefresh;
$("#getApp").onclick = showGetApp;

/* refresh: every minute from 9:00 to 3:35 on weekdays (live prices are published each minute), else every 15 minutes;
   and when the app comes back */
function due(){
  var t = ist(), market = !t.weekend && t.mins >= 540 && t.mins <= 935;
  return Date.now() - st.loadedAt > (market ? 55e3 : 900e3);
}
setInterval(function(){
  drawClock();
  if (!document.hidden && !st.loading && $("#sheet").hidden && (!st.day || st.day === st.latest) && due()){ PX.reset(); load(); }
}, 30e3);
var hiddenAt = 0, REASK_AFTER = 30 * 60e3;   // coming back after 30 minutes away counts as a new visit: accept again
document.addEventListener("visibilitychange", function(){
  if (document.hidden){ hiddenAt = Date.now(); return; }
  if (document.body.classList.contains("locked") && $("#v-check") && !$("#v-check").disabled){ $("#v-check").click(); return; }
  if (hiddenAt && Date.now() - hiddenAt > REASK_AFTER && !document.body.classList.contains("locked")){ closeSheet(); gateStart(); return; }
  drawClock();
  if (Date.now() - st.loadedAt > 60e3 && (!st.day || st.day === st.latest) && $("#sheet").hidden){ load(); pullProfile(false); }
});

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  navigator.serviceWorker.register("sw.js", {scope:"./"}).catch(function(){});

if (params.has("demo")){ S.source = "demo"; }
inAndroidApp();   // remember "opened from the Android app" before the address is tidied below
if (params.get("tab")){ st.tab = params.get("tab"); document.querySelectorAll("nav.tabs [data-tab]").forEach(function(x){ x.setAttribute("aria-selected", x.dataset.tab === st.tab); }); }
$("#getApp").hidden = inAndroidApp() || standalone();
if (params.has("tab") || params.has("app")) history.replaceState(null, "", location.pathname + (params.has("demo") ? "?demo" : ""));
gateStart();
</script>
