<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found</title>
<script>
  /* Phones often capitalise the first letter of a typed address (/Trade), and GitHub Pages addresses are
     case-sensitive. Send any spelling of Opening Bell's address to the real one, keeping the rest. */
  (function () {
    var p = location.pathname, m = p.match(/^\/(trades?|opening-?bell)(\/.*)?$/i);
    if (m) location.replace("/trade" + (m[2] && m[2] !== "/" ? m[2] : "/") + location.search + location.hash);
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#121914;color:#eef1ee;
       font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
  main{max-width:420px}
  h1{font-size:22px;margin:0 0 8px}
  a{color:inherit}
  ul{padding-left:20px}
</style>
</head>
<body>
<main>
  <h1>Page not found</h1>
  <p>There's nothing at this address. Did you mean one of these?</p>
  <ul>
    <li><a href="/">Fovea</a></li>
    <li><a href="/trade/">Opening Bell</a></li>
  </ul>
</main>
</body>
</html>
